# Weekly pull requests for dependency updates. Each one runs the full CI (lint, unit tests,
# build, browser tests) and gets a preview site, so an update that breaks something is caught
# before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine minor and patch updates arrive as one PR instead of a dozen.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions of these change APIs the app depends on; take them deliberately.
      - dependency-name: firebase
        update-types: [version-update:semver-major]
      - dependency-name: '@xyflow/react'
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # These majors broke the build in November 2026 and were rolled back. Each needs
      # companion upgrades first: TypeScript 7 needs a typescript-eslint that accepts it,
      # Vite 8 needs @vitejs/plugin-react 5+ and a matching vitest, and react-hooks 7 adds
      # new lint rules the code does not pass yet. Take them deliberately in their own PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: eslint-plugin-react-hooks
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
